apiVersion: v1
kind: Pod
metadata:
  name: kubeops-readiness-test
  labels:
    app: kubeops-readiness-test
spec:
  containers:
    - name: readiness-container
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
      args:
        - "mkdir -p /www && echo 'Application is running' > /www/index.html && httpd -f -p 8080 -h /www"
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          # path: /wrong-health
          path: /index.html
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
  restartPolicy: Always