apiVersion: v1
kind: Pod

metadata:
  name: kubeops-crash-test
  labels:
    app: kubeops-crash-test

spec:
  restartPolicy: Always
  containers: 
    - name: crash-container
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        # - "echo 'Starting application...'; echo 'Fatal error: missing configuration'; exit 1"
        - "echo 'Application started successfully'; sleep 3600"
