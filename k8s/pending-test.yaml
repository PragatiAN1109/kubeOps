apiVersion: v1
kind: Pod
metadata:
  name: kubeops-pending-test
  labels:
    app: kubeops-pending-test
spec:
  containers:
    - name: pending-container
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          # cpu: "10"
          cpu: 100m
          memory: "64Mi"
        limits:
          cpu: "10"
          memory: "128Mi"
  restartPolicy: Always