apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubeops-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kubeops-api

  template:
    metadata:
      labels:
        app: kubeops-api

    spec:
      containers:
        - name: kubeops-api
          image: kubeops-api:v1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
